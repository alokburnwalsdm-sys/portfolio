<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selected work | Alok Kumar Burnwal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--fd:Manrope,system-ui,sans-serif;--fb:Inter,system-ui,sans-serif;--bg:#f6f6f6;--ink:#262626;--mut:#6b6b6b;--line:#e2e2e2;--red:#e0161f}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--fb);line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
a{color:inherit}
.btn{text-decoration:none;border-radius:999px;font-family:var(--fd);font-weight:700}
.nav{position:sticky;top:0;z-index:5;background:rgba(246,246,246,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(18px,5vw,72px);border-bottom:1px solid var(--line)}
.nav a{text-decoration:none;font-family:var(--fd);font-weight:700}
.nav .bk{font-weight:500;color:var(--mut);font-size:.95rem}.nav .bk:hover{color:var(--ink)}
.nav .cm{background:var(--red);color:#fff;padding:10px 20px;border-radius:999px;font-size:.95rem}
.head{text-align:center;padding:clamp(40px,7vw,90px) 20px 10px}
.lab{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-size:.9rem}
.lab i{width:8px;height:8px;border-radius:50%;background:var(--red);display:block}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(2.8rem,8vw,5.6rem);letter-spacing:-.05em;line-height:1.05;margin-top:10px;color:var(--ink)}
.list{max-width:1120px;margin:0 auto;padding:clamp(28px,5vw,60px) clamp(18px,4vw,32px) 80px;display:grid;gap:clamp(48px,7vw,84px)}
.item{display:block;text-decoration:none;color:inherit}
.media{aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(224,22,31,.25),#101010 72%);display:grid;place-items:center;position:relative;color:#fff}
.media>*{transition:transform .6s}
.item:hover .media>*{transform:scale(1.03)}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.soon{font-family:var(--fd);font-weight:800;font-size:clamp(1.4rem,4vw,3rem);color:#bdb5b5;text-align:center;padding:12px}
.phone{width:clamp(110px,18vw,170px);aspect-ratio:1/1.75;border:3px solid #444;border-radius:26px;background:#1a1a1a;display:grid;place-items:center;position:relative}
.ring{transform:rotate(-90deg);width:62%;height:auto}.ring circle{fill:none;stroke-width:9}
.kcal{position:absolute;font-family:var(--fd);font-weight:800;font-size:clamp(.9rem,2vw,1.3rem)}
.brand{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(44%,360px)}.brand i{aspect-ratio:1;display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:26px}
.row h2{font-family:var(--fd);font-weight:400;font-size:clamp(1.9rem,4.4vw,3.2rem);letter-spacing:-.045em;line-height:1.05}
.vbtn{flex:none;background:#2b2b2b;color:#fff;font-weight:600;font-size:.9rem;padding:12px 24px;border-radius:999px;transition:background .25s,transform .25s}
.item:hover .vbtn{background:var(--red);transform:translateX(-4px)}
.d{color:var(--mut);font-size:.98rem;max-width:62ch;margin-top:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:12px;color:var(--mut);font-size:.88rem}
.tg b{color:var(--red)}
.vw{display:flex;align-items:center;gap:6px}.vw svg{width:16px;height:16px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
@media(max-width:560px){.row{flex-direction:column;align-items:flex-start;gap:14px}}
.cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:18px;gap:10px}
.cf{--d-bg:#111111;--d-ink:#ffffff;--d-mut:#c4c4c4;--d-line:#2e2e2e;background:var(--d-bg);color:var(--d-ink);padding:clamp(60px,9vw,110px) 5vw calc(70px + env(safe-area-inset-bottom,0px));margin-top:40px;position:relative;overflow:hidden}
.cf::before{content:"";position:absolute;left:-10%;top:-20%;width:60%;height:120%;background:radial-gradient(closest-side,rgba(200,52,43,.22),transparent);pointer-events:none}
.cf .fg{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:6vw;align-items:start;max-width:1300px;margin:0 auto}
.cf .fl{display:flex;flex-direction:column;gap:40px}
.cf .fh{font-family:var(--fd);font-weight:500;font-size:clamp(2.6rem,7vw,6rem);line-height:1;letter-spacing:-.045em}
.cf .fs2{color:var(--d-mut);font-size:1.15rem;max-width:34ch}
.cf .fr{display:grid;gap:36px;align-content:start}
.cf .prof{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.cf .avw{display:flex;align-items:center;flex:none}
.cf .avw i{display:block;width:26px;border-radius:100% 0 0 100%/50% 0 0 50%;background:var(--red);margin-right:-8px}
.cf .avw i:nth-child(1){height:70px;opacity:.3}
.cf .avw i:nth-child(2){height:92px;opacity:.55}
.cf .avc{position:relative;z-index:1;width:100px;height:100px;border-radius:50%;background:#262626 center/cover no-repeat;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:2.4rem;color:var(--red)}
.cf .pinf b{display:block;font-family:var(--fd);font-size:1.5rem;letter-spacing:-.02em}
.cf .pinf span{color:var(--d-mut)}
.cf .fsoc{display:flex;gap:10px;margin-top:14px}
.cf .fsoc a{width:40px;height:40px;border-radius:50%;border:1px solid var(--d-line);display:grid;place-items:center;color:var(--d-ink);text-decoration:none;font-size:.8rem;font-family:var(--fd);font-weight:800;transition:background .2s,border-color .2s}
.cf .fsoc a:hover{background:var(--red);border-color:var(--red)}
.cf .fsoc svg{width:18px;height:18px}
.cf .lab{display:flex;align-items:center;gap:10px;color:var(--d-mut);margin-bottom:14px}
.cf .lab i{width:10px;height:10px;border-radius:50%;background:var(--red);display:block}
.cf .fem{font-family:var(--fd);font-weight:600;font-size:clamp(1.1rem,2vw,1.6rem);letter-spacing:-.03em;line-height:1.1;text-decoration:none;word-break:break-all;display:block;color:var(--d-ink);transition:color .2s}
.cf .fem:hover{color:var(--red)}
.cf .pill{display:inline-flex;align-items:center;gap:20px;padding:9px 9px 9px 28px;justify-self:start;box-shadow:0 10px 40px rgba(224,22,31,.4);background:var(--red);color:#fff}
.cf .pill .ar{width:44px;height:44px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:1.2rem}
@media(max-width:820px){.cf .fg{grid-template-columns:1fr;gap:44px}}
</style>
</head>
<body>
<div class="nav"><a href="index.html" id="nm">Alok Kumar Burnwal</a><a class="bk" href="index.html#work">&larr; Back to home</a><a class="cm" href="contact.html">Contact me</a></div>
<div class="head"><div class="lab"><i></i><span>My recent projects</span></div><h1>Selected work</h1></div>
<div class="list" id="grid"></div>
<footer class="cf" id="cf">
  <div class="fg">
    <div class="fl"><h2 class="fh" id="cf-lead">Have something in mind?</h2><p class="fs2" id="cf-sub">Let&rsquo;s connect, exchange ideas, and build something valuable</p></div>
    <div class="fr">
      <div class="prof"><div class="avw"><i></i><i></i><i></i><div class="avc" id="cf-av" role="img" aria-label="Profile photo"><span id="cf-avl">A</span></div></div><div class="pinf"><b id="cf-name">Alok Kumar Burnwal</b><span id="cf-role">UI/UX &amp; Brand Designer</span><div class="fsoc" id="cf-soc"></div></div></div>
      <div><div class="lab"><i></i>Contact me</div><a class="fem" id="cf-em" href="contact.html"></a></div>
      <a class="btn pill" href="contact.html">Contact me<span class="ar" aria-hidden="true">&nearr;</span></a>
    </div>
  </div>
</footer>
<script src="media.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function media(c){var m=el('div','media'),cu=c.cover_video||c.img,cm=null;
  try{cm=cu&&window.AMedia&&(AMedia.kind(cu)==='image'||AMedia.kind(cu)==='video')?AMedia.el(cu,{cover:true,alt:c.title||''}):null}catch(e){}
  if(cm)m.appendChild(cm);
  else if(c.art==='ring'){m.innerHTML='<div class="phone"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="#3a1a1c"/><circle cx="50" cy="50" r="40" stroke="#e0161f" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="70"/></svg><span class="kcal">1325</span></div>'}
  else if(c.art==='brand'){m.innerHTML='<div class="brand"><i style="background:#e0161f"></i><i style="background:#f4ecea"></i><i style="background:#3a1a1c"></i><i style="background:#a89a98;border-radius:50%"></i></div>'}
  else m.appendChild(el('div','soon','IMAGE COMING SOON'));
  return m}
var vf=window.__vf||function(u,o){return fetch(u,o)};
fetch('content.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){
  var cards=c.cards||[],g=$('grid'),vws=[];
  if(!cards.length)g.appendChild(el('div','empty','Projects coming soon.'));
  cards.forEach(function(d,i){
    var a=el('a','item');a.href='project.html?p='+i;
    a.appendChild(media(d));
    var r=el('div','row');r.appendChild(el('h2',0,d.title||'Project'));r.appendChild(el('span','vbtn','View Project'));a.appendChild(r);
    if(d.desc)a.appendChild(el('p','d',d.desc));
    var mt=el('div','meta');
    if(d.tag){var tg=el('span','tg');tg.appendChild(el('b',0,'{'));tg.appendChild(document.createTextNode(' '+d.tag+' '));tg.appendChild(el('b',0,'}'));mt.appendChild(tg)}
    var v=el('span','vw');v.hidden=true;vws.push(v);mt.appendChild(v);a.appendChild(mt);g.appendChild(a)});
  vf('/api/views',{cache:'no-store'}).then(function(r){return r&&r.ok?r.json():null}).then(function(j){
    if(!j)return;vws.forEach(function(v,i){var n=+j[i]||0;v.innerHTML=EYE;v.appendChild(document.createTextNode(n.toLocaleString('en-IN')+(n===1?' view':' views')));v.hidden=false})}).catch(function(){});
  var K=c.contact||{},T=c.texts||{};
  if(K.lead)$('cf-lead').textContent=K.lead;if(T.csub)$('cf-sub').textContent=T.csub;
  if(T.name)$('cf-name').textContent=T.name;if(T.role)$('cf-role').textContent=T.role;
  if(c.photo){$('cf-av').style.backgroundImage='url("'+String(c.photo).replace(/"/g,'%22')+'")';$('cf-avl').style.display='none'}
  if(K.email){var em=$('cf-em');em.textContent=K.email;em.href='mailto:'+K.email}
  var SOCIC={linkedin:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="9" width="3.6" height="12"/><circle cx="4.8" cy="4.8" r="2.1"/><path d="M10 9h3.4v1.7c.6-1.1 1.9-2 3.8-2 3.5 0 4.3 2.3 4.3 5.3V21h-3.6v-6.2c0-1.5-.1-3-2-3s-2.3 1.4-2.3 2.9V21H10z"/></svg>',instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>',dribbble:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M5.5 5.5c5 1 9 5.5 11 12.5M2.7 11.3c5.5.3 11-1.2 15.6-5.3M8.5 21c1.5-5 4.5-8.5 10.5-9.7"/></svg>',behance:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2 6h5.6c2 0 3.2 1 3.2 2.6 0 1.1-.6 1.9-1.5 2.3 1.3.3 2.1 1.3 2.1 2.7 0 1.9-1.4 3.1-3.6 3.1H2zM4.4 8v2.3h2.6c.8 0 1.2-.4 1.2-1.1S7.8 8 7 8zM4.4 12.2v2.6h2.9c.9 0 1.4-.5 1.4-1.3s-.5-1.3-1.4-1.3z"/><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="17.6" cy="14" r="3"/><path d="M14.6 14h6M14.6 7.6h6"/></g></svg>'};
  (c.social||[]).forEach(function(x){var a=document.createElement('a'),u=String(x.url||'#');if(!/^(https?:|mailto:|#)/.test(u))u='#';a.href=u;a.setAttribute('aria-label',x.name||'');if(/^https?:/.test(u)){a.target='_blank';a.rel='noopener'}var ic=SOCIC[String(x.name).toLowerCase()];if(ic)a.innerHTML=ic;else a.textContent=x.short||String(x.name||'').slice(0,2);$('cf-soc').appendChild(a)});
}).catch(function(e){console.error(e);$('grid').appendChild(el('div','empty','Could not load projects.'))});
})();
</script>
</body>
</html>
