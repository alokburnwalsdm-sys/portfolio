<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project | Alok Kumar Burnwal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--fd:Manrope,system-ui,sans-serif;--fb:Inter,system-ui,sans-serif;--bg:#f7f7f7;--card:#ffffff;--ink:#111111;--mut:#5a5a5a;--red:#c8342b;--line:#e4e4e4}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);padding-top:env(safe-area-inset-top,0px);line-height:1.6}
a{color:inherit}
.nav{position:sticky;top:0;z-index:5;background:rgba(17,17,17,.92);backdrop-filter:blur(8px);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(18px,5vw,72px)}
.nav a{text-decoration:none;font-family:var(--fd);font-weight:700}
.nav .bk{font-weight:500;color:#cfcfcf;font-size:.95rem}
.nav .bk:hover{color:#fff}
.nav .cm{background:var(--red);padding:10px 20px;border-radius:999px;font-size:.95rem}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(18px,5vw,40px)}
.tag{display:inline-flex;align-items:center;gap:10px;color:var(--red);font-weight:600;font-size:.95rem}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--red);display:block}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;margin:14px 0 18px;text-transform:uppercase}
.lead{color:var(--mut);font-size:1.15rem;max-width:760px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:34px 0;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta div span{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:4px}
.meta div b{font-family:var(--fd);font-size:1.05rem}
.about{max-width:760px;white-space:pre-line;font-size:1.08rem;margin-bottom:34px}
.gal{display:grid;gap:22px}
.gal img{width:100%;height:auto;display:block;border-radius:20px;border:1px solid var(--line);background:#fff}
.soon{background:#111;color:#cfcfcf;border-radius:20px;display:grid;place-items:center;aspect-ratio:16/9;font-family:var(--fd);font-weight:800;font-size:clamp(1.4rem,4vw,2.6rem);text-align:center;padding:20px}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin:34px 0 10px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;padding:14px 26px;border-radius:999px;text-decoration:none;font-family:var(--fd);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.pn{display:flex;justify-content:space-between;gap:16px;margin-top:56px;padding-top:26px;border-top:1px solid var(--line)}
.pn a{text-decoration:none;max-width:48%}
.pn small{display:block;color:var(--mut)}
.pn b{font-family:var(--fd);font-size:1.15rem}
.pn a:last-child{text-align:right;margin-left:auto}

.hd{max-width:1100px}
.cover{width:100%;display:block;border-radius:22px;border:1px solid var(--line);margin-top:34px;overflow:hidden}
.lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(28px,5vw,64px);margin-top:44px;align-items:start}
.side{position:sticky;top:92px}
.side h4{font-family:var(--fd);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:1rem;margin-bottom:14px}
.side a{position:relative;display:block;padding:7px 0 7px 16px;border-left:2px solid var(--line);color:var(--mut);text-decoration:none;font-size:1rem;transition:color .25s,padding-left .25s}
.side a::after{content:"";position:absolute;left:-2px;top:0;bottom:0;width:2px;background:var(--red);transform:scaleY(0);transform-origin:top;transition:transform .3s}
.side a:hover{color:var(--red);padding-left:26px}
.side a:hover::after,.side a.on::after{transform:scaleY(1)}
.side a.on{color:var(--red);font-weight:600}
.sec{scroll-margin-top:96px;margin-bottom:68px}
.sec .top{display:grid;grid-template-columns:minmax(120px,1fr) 2.2fr;gap:24px}
.sec h2{font-family:var(--fd);font-weight:800;font-size:clamp(1.5rem,3vw,2rem);line-height:1.15}
.sec .tx{color:var(--mut);white-space:pre-line;font-size:1.05rem}
.sec .im{display:grid;gap:22px;margin-top:28px}
.sec .im img{width:100%;height:auto;display:block;border-radius:20px;border:1px solid var(--line);background:#fff}
@media(max-width:820px){
 .lay{grid-template-columns:1fr;gap:18px}
 .side{top:62px;z-index:4;background:var(--bg);margin:0 calc(-1*clamp(18px,5vw,40px));padding:6px clamp(18px,5vw,40px);display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line)}
 .side h4{display:none}
 .side a{border:0;padding:8px 2px;white-space:nowrap}
 .side a:hover{padding-left:2px}
 .side a::after{left:0;right:0;top:auto;bottom:0;width:auto;height:2px;transform:scaleX(0);transform-origin:left}
 .side a:hover::after,.side a.on::after{transform:scaleX(1)}
 .sec .top{grid-template-columns:1fr;gap:10px}
}

.cf{--d-bg:#111111;--d-ink:#ffffff;--d-mut:#c4c4c4;--d-line:#2e2e2e;background:var(--d-bg);color:var(--d-ink);padding:clamp(60px,9vw,110px) 5vw calc(70px + env(safe-area-inset-bottom,0px));margin-top:40px;position:relative;overflow:hidden}
.cf::before{content:"";position:absolute;left:-10%;top:-20%;width:60%;height:120%;background:radial-gradient(closest-side,rgba(200,52,43,.22),transparent);pointer-events:none}
.cf .fg{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:6vw;align-items:start;max-width:1300px;margin:0 auto}
.cf .fl{display:flex;flex-direction:column;gap:40px}
.cf .fh{font-family:var(--fd);font-weight:500;font-size:clamp(2.6rem,7vw,6rem);line-height:1;letter-spacing:-.045em}
.cf .fs2{color:var(--d-mut);font-size:1.15rem;max-width:34ch}
.cf .fr{display:grid;gap:36px;align-content:start}
.cf .prof{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.cf .avw{display:flex;align-items:center;flex:none}
.cf .avw i{display:block;width:26px;border-radius:100% 0 0 100%/50% 0 0 50%;background:var(--red);margin-right:-8px}
.cf .avw i:nth-child(1){height:70px;opacity:.3}
.cf .avw i:nth-child(2){height:92px;opacity:.55}
.cf .avc{position:relative;z-index:1;width:100px;height:100px;border-radius:50%;background:#262626 center/cover no-repeat;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:2.4rem;color:var(--red)}
.cf .pinf b{display:block;font-family:var(--fd);font-size:1.5rem;letter-spacing:-.02em}
.cf .pinf span{color:var(--d-mut)}
.cf .fsoc{display:flex;gap:10px;margin-top:14px}
.cf .fsoc a{width:40px;height:40px;border-radius:50%;border:1px solid var(--d-line);display:grid;place-items:center;color:var(--d-ink);text-decoration:none;font-size:.8rem;font-family:var(--fd);font-weight:800;transition:background .2s,border-color .2s}
.cf .fsoc a:hover{background:var(--red);border-color:var(--red)}
.cf .fsoc svg{width:18px;height:18px}
.cf .lab{display:flex;align-items:center;gap:10px;color:var(--d-mut);margin-bottom:14px}
.cf .lab i{width:10px;height:10px;border-radius:50%;background:var(--red);display:block}
.cf .fem{font-family:var(--fd);font-weight:600;font-size:clamp(1.1rem,2vw,1.6rem);letter-spacing:-.03em;line-height:1.1;text-decoration:none;word-break:break-all;display:block;color:var(--d-ink);transition:color .2s}
.cf .fem:hover{color:var(--red)}
.cf .pill{display:inline-flex;align-items:center;gap:20px;padding:9px 9px 9px 28px;justify-self:start;box-shadow:0 10px 40px rgba(224,22,31,.4);background:var(--red);color:#fff}
.cf .pill .ar{width:44px;height:44px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:1.2rem}
@media(max-width:820px){.cf .fg{grid-template-columns:1fr;gap:44px}}
.vwp{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:.95rem;margin-top:12px}
.vwp svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="nav"><a href="index.html" id="nm">Alok Kumar Burnwal</a><a class="bk" href="index.html#work">&larr; Back to work</a><a class="cm" href="contact.html">Contact me</a></div>
<div class="wrap">
  <div class="tag"><i></i><span id="tg"></span></div>
  <div class="vwp" id="vw" hidden></div>
  <h1 id="ttl">Project</h1>
  <p class="lead" id="ds"></p>
  <div class="meta" id="meta" hidden></div>
  <div class="cover" id="cvw" hidden></div>
  <div class="lay"><nav class="side" id="side" aria-label="Sections"><h4>Content</h4></nav><div id="secs"></div></div>
  <div class="btns" id="btns"></div>
  <div class="pn" id="pn"></div>
</div>
<footer class="cf" id="cf">
  <div class="fg">
    <div class="fl"><h2 class="fh" id="cf-lead">Have something in mind?</h2><p class="fs2" id="cf-sub">Let&rsquo;s connect, exchange ideas, and build something valuable</p></div>
    <div class="fr">
      <div class="prof"><div class="avw"><i></i><i></i><i></i><div class="avc" id="cf-av" role="img" aria-label="Profile photo"><span id="cf-avl">A</span></div></div><div class="pinf"><b id="cf-name">Alok Kumar Burnwal</b><span id="cf-role">UI/UX &amp; Brand Designer</span><div class="fsoc" id="cf-soc"></div></div></div>
      <div><div class="lab"><i></i>Contact me</div><a class="fem" id="cf-em" href="contact.html"></a></div>
      <a class="btn pill" href="contact.html">Contact me<span class="ar" aria-hidden="true">&nearr;</span></a>
    </div>
  </div>
</footer>
<script src="media.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function ok(u){return typeof u==='string'&&/^https?:\/\//i.test(u)}
fetch('content.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){
  var cards=c.cards||[],p=parseInt(new URLSearchParams(location.search).get('p'),10);
  if(isNaN(p)||p<0||p>=cards.length)p=0;
  var d=cards[p]||{},name=(c.texts&&c.texts.name)||'Alok Kumar Burnwal';
  $('nm').textContent=name;document.title=(d.title||'Project')+' | '+name;
  $('ttl').textContent=d.title||'Project';$('tg').textContent=d.tag||'Project';
  $('ds').textContent=d.desc||'';
  var m=[['Role',d.role],['Year',d.year],['Tools',d.tools]].filter(function(x){return x[1]});
  if(m.length){var mt=$('meta');m.forEach(function(x){var e=document.createElement('div'),s=document.createElement('span'),b=document.createElement('b');s.textContent=x[0];b.textContent=x[1];e.appendChild(s);e.appendChild(b);mt.appendChild(e)});mt.hidden=false}
  var cu=d.cover_video||d.img||'';if(cu&&window.AMedia){var cmn=AMedia.el(cu,{alt:d.title||''});if(cmn){$('cvw').appendChild(cmn);$('cvw').hidden=false}}
  var secs=(d.sections||[]).filter(function(x){return x&&(x.title||x.text||(x.images&&x.images.length)||(x.media&&x.media.length))});
  if(!secs.length){var more=[d.img2,d.img3].concat(d.gallery||[]).filter(Boolean);secs=[{title:'Overview',text:d.details||d.desc||'',images:more}]}
  var side=$('side'),box=$('secs'),links=[],nodes=[];
  secs.forEach(function(x,n){
    var t=x.title||('Section '+(n+1)),sec=document.createElement('section');sec.className='sec';sec.id='s-'+n;
    var top=document.createElement('div');top.className='top';var h=document.createElement('h2');h.textContent=t;top.appendChild(h);
    if(x.text){var p=document.createElement('div');p.className='tx';p.textContent=x.text;top.appendChild(p)}
    sec.appendChild(top);
    var items=[];(x.media||[]).forEach(function(m){if(!m)return;var u=m.image||m.file||m.link;if(u)items.push({u:u,cap:m.caption})});(x.images||[]).forEach(function(u){if(u)items.push({u:u})});
    if(items.length){var im=document.createElement('div');im.className='im';items.forEach(function(it){var e=window.AMedia?AMedia.el(it.u,{alt:t,caption:it.cap}):null;if(e)im.appendChild(e)});sec.appendChild(im)}
    box.appendChild(sec);nodes.push(sec);
    var l=document.createElement('a');l.href='#s-'+n;l.textContent=t;
    l.onclick=function(e){e.preventDefault();sec.scrollIntoView({behavior:'smooth',block:'start'})};
    side.appendChild(l);links.push(l)});
  function setOn(k){links.forEach(function(l,j){l.classList.toggle('on',j===k)})}
  setOn(0);
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting)setOn(nodes.indexOf(e.target))})},{rootMargin:'-25% 0px -65% 0px'});nodes.forEach(function(n){io.observe(n)})}
  var K=c.contact||{},T=c.texts||{};
  if(K.lead)$('cf-lead').textContent=K.lead;if(T.csub)$('cf-sub').textContent=T.csub;
  if(T.name)$('cf-name').textContent=T.name;if(T.role)$('cf-role').textContent=T.role;
  if(c.photo){$('cf-av').style.backgroundImage='url("'+String(c.photo).replace(/"/g,'%22')+'")';$('cf-avl').style.display='none'}
  if(K.email){var em=$('cf-em');em.textContent=K.email;em.href='mailto:'+K.email}
  var SOCIC={linkedin:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="9" width="3.6" height="12"/><circle cx="4.8" cy="4.8" r="2.1"/><path d="M10 9h3.4v1.7c.6-1.1 1.9-2 3.8-2 3.5 0 4.3 2.3 4.3 5.3V21h-3.6v-6.2c0-1.5-.1-3-2-3s-2.3 1.4-2.3 2.9V21H10z"/></svg>',instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>',dribbble:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M5.5 5.5c5 1 9 5.5 11 12.5M2.7 11.3c5.5.3 11-1.2 15.6-5.3M8.5 21c1.5-5 4.5-8.5 10.5-9.7"/></svg>',behance:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2 6h5.6c2 0 3.2 1 3.2 2.6 0 1.1-.6 1.9-1.5 2.3 1.3.3 2.1 1.3 2.1 2.7 0 1.9-1.4 3.1-3.6 3.1H2zM4.4 8v2.3h2.6c.8 0 1.2-.4 1.2-1.1S7.8 8 7 8zM4.4 12.2v2.6h2.9c.9 0 1.4-.5 1.4-1.3s-.5-1.3-1.4-1.3z"/><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="17.6" cy="14" r="3"/><path d="M14.6 14h6M14.6 7.6h6"/></g></svg>'};
  (c.social||[]).forEach(function(x){var a=document.createElement('a'),u=String(x.url||'#');if(!/^(https?:|mailto:|#)/.test(u))u='#';a.href=u;a.setAttribute('aria-label',x.name||'');if(/^https?:/.test(u)){a.target='_blank';a.rel='noopener'}var ic=SOCIC[String(x.name).toLowerCase()];if(ic)a.innerHTML=ic;else a.textContent=x.short||String(x.name||'').slice(0,2);$('cf-soc').appendChild(a)});
  (function(){var vf=window.__vf||function(u,o){return fetch(u,o)},skip=false,seen=false,key='v'+p+'-'+new Date().toISOString().slice(0,10);
    try{if(/[?&]nocount/.test(location.search))localStorage.setItem('nocount','1');skip=localStorage.getItem('nocount')==='1';seen=!!localStorage.getItem(key)}catch(e){}
    var count=!(skip||seen);
    vf('/api/views'+(count?'?p='+p:''),{method:count?'POST':'GET',cache:'no-store'}).then(function(r){return r&&r.ok?r.json():null}).then(function(j){
      if(!j)return;var n=+j[p]||0,v=$('vw');v.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
      v.appendChild(document.createTextNode(n.toLocaleString('en-IN')+(n===1?' view':' views')));v.hidden=false;
      if(count){try{localStorage.setItem(key,'1')}catch(e){}}}).catch(function(){})})();
  var bt=$('btns');
  if(ok(d.link)){var a=document.createElement('a');a.className='btn';a.href=d.link;a.target='_blank';a.rel='noopener';a.textContent=(d.link_text||'View full project')+' \u2197';bt.appendChild(a)}
  var a2=document.createElement('a');a2.className='btn ghost';a2.href='projects.html';a2.textContent='All projects';bt.appendChild(a2);
  if(cards.length>1){var pr=(p-1+cards.length)%cards.length,nx=(p+1)%cards.length,pn=$('pn');
    [[pr,'Previous'],[nx,'Next']].forEach(function(x){var a=document.createElement('a');a.href='project.html?p='+x[0];var s=document.createElement('small'),b=document.createElement('b');s.textContent=x[1];b.textContent=cards[x[0]].title||'Project';a.appendChild(s);a.appendChild(b);pn.appendChild(a)})}
}).catch(function(){$('ttl').textContent='Project not found'});
})();
</script>
</body>
</html>
